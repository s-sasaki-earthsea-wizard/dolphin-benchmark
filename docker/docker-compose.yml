# Run via `./run.sh`. The wrapper supplies `--env-file ../.env` so values from
# the repo-root .env feed BOTH compose-time path substitution AND the in-container
# environment. If you invoke `docker compose` directly, add `--env-file ../.env`.
#
# User-specific paths (DATA_DIR, OPERA_CSLC_DIR, ASF_USERNAME/ASF_PASSWORD) live
# in .env (gitignored) — see .env.example for the expected variables.
# Anything that is *not* user-specific (e.g. DOLPHIN_SRC defaulting to ../..)
# may have a default here.

services:
  dev:
    image: dolphin-benchmark:gpu
    # Stable hostname: asv derives its default machine name from the hostname,
    # and result files are keyed by machine name. Without this, every
    # `docker compose run` gets a random hostname and results scatter across
    # phantom machines.
    hostname: dolphin-bench
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Match host UID/GID so files created in mounts stay owner-correct.
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
        # Bump these to pick a different CUDA / Ubuntu base.
        CUDA_VERSION: "12.6.3"
        UBUNTU_VERSION: "22.04"
    # CAP_SYS_PTRACE lets py-spy attach to the profiled process (and its
    # --subprocesses children) inside the container. Docker's default cap set
    # omits it, which makes py-spy fail with "Operation not permitted".
    cap_add:
      - SYS_PTRACE
    # GPU passthrough — requires nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ASF / NASA Earthdata credentials are passed in via .env at the
    # repo root (NOT in this directory). env_file loads values as-is —
    # no shell interpolation — so passwords with $ or other special chars
    # are safe. .env is git-ignored; do not commit it.
    env_file:
      - ../.env
    volumes: &common_volumes
      # dolphin source (rw, for `pip install -e .` and source edits).
      - "${DOLPHIN_SRC:-../..}:/dolphin:rw"
      # this benchmark repo (rw, for results and scratch).
      - "..:/dolphin-benchmark:rw"
      # SAR test data (ro). Set DATA_DIR in .env to your raw SAFE tree.
      - "${DATA_DIR:?DATA_DIR not set — copy .env.example to .env and fill it in}:/data:ro"
      # OPERA CSLC tutorial dataset (rw). Downloads land here so they persist
      # across container restarts. Set OPERA_CSLC_DIR in .env.
      - "${OPERA_CSLC_DIR:?OPERA_CSLC_DIR not set — copy .env.example to .env and fill it in}:/cslc:rw"
      # Per-run scratch (defaults to ../results on host).
      - "../results:/work:rw"
      # asv environments, per-commit checkouts and build caches. A named
      # volume on container-local disk: both repos are NAS-mounted, and asv's
      # env creation / wheel builds are far too write-heavy for the NAS.
      # Only result JSONs (written to /work) land on the NAS.
      - "asv-env:/asv-env"
    working_dir: /work
    # tty + stdin for interactive shell; -i compose flag also needed (see README).
    tty: true
    stdin_open: true
    # Editable install runs once per container start. Fast no-op after the first time
    # because pip detects no changes.
    command: >
      bash -lc "
        pip install --no-deps --quiet -e /dolphin &&
        echo '--- dolphin-benchmark dev shell ---' &&
        echo 'dolphin source: /dolphin (editable)' &&
        echo 'benchmark repo: /dolphin-benchmark' &&
        echo 'data (ro):      /data' &&
        echo 'cslc (rw):      /cslc' &&
        echo 'workdir:        /work' &&
        echo &&
        nvidia-smi --query-gpu=name,memory.total --format=csv,noheader 2>/dev/null | sed 's/^/GPU: /' &&
        python -c 'import jax; print(\"JAX backend:\", jax.default_backend(), \"devices:\", jax.devices())' &&
        exec bash -l
      "

  # Unwrapper comparison (issue #13): SNAPHU vs ICU/PHASS vs whirlwind.
  #
  # A derived image rather than a variant of `dev`, because the comparison
  # needs conda-forge `isce3` (via `tophu`) and isce3 has no Python 3.14
  # build, while dolphin-env is on 3.14. Rationale in Dockerfile.unwrap.
  # GPU passthrough is kept only because conda-forge ships isce3 as a CUDA
  # build — no unwrapper measured here has a GPU path.
  unwrap:
    image: dolphin-benchmark:unwrap
    hostname: dolphin-bench
    build:
      context: .
      dockerfile: Dockerfile.unwrap
      args:
        BASE_IMAGE: dolphin-benchmark:gpu
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - ../.env
    volumes: *common_volumes
    working_dir: /work
    tty: true
    stdin_open: true
    command: >
      bash -lc "
        pip install --no-deps --quiet -e /dolphin &&
        echo '--- unwrapper comparison shell (issue #13) ---' &&
        echo 'conda env:      unwrap-cmp' &&
        cat /opt/conda/unwrap-solver-info.txt &&
        exec bash -l
      "

volumes:
  # asv env/build cache — see the /asv-env mount in the dev service.
  asv-env:
