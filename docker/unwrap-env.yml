# Environment for the unwrapper comparison (issue #13).
#
# Separate from `dolphin-env` for one hard reason: conda-forge `isce3` (which
# `tophu` needs for the ICU/PHASS unwrappers) has no Python 3.14 build, and
# `dolphin-env` is on 3.14. Solving `isce3` into it fails outright:
#
#     isce3 [0.24.3|...|0.25.8] would require python >=3.13,<3.14.0a0
#     pin on python =3.14 is not installable
#
# So this env pins python 3.13. It is *additive* — `dolphin-env` is left
# untouched so the ASV baselines in results/asv-baseline/ stay reproducible.
#
# Consequence for the comparison: SNAPHU must be re-measured in THIS env
# rather than reusing the #12 numbers, otherwise the solvers are compared
# across two different Python/numpy/GDAL stacks. See benchmarks/unwrap_comparison/.

name: unwrap-cmp
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip>=21.3
  - git

  # --- the reason this env exists ---------------------------------------
  # tophu is dolphin's multiscale wrapper for the isce3 unwrappers; it is the
  # only path by which `unwrap_method: icu` / `phass` can run.
  - tophu>=0.2.1
  - isce3>=0.25
  # tophu declares only `dask >=2022.05.1`, and left to itself the solver picks
  # dask 2023.3.0 — which imports `numpy.compat`, removed in numpy 2.0. tophu
  # then reports "Dask array requirements are not installed" and every
  # ICU/PHASS call fails with ModuleNotFoundError. Pin forward explicitly.
  - dask>=2025.1

  # --- dolphin runtime deps (mirrors docker/conda-env.yml) --------------
  # dolphin itself is installed with `pip install --no-deps -e /dolphin`, so
  # its dependency set has to be provided here explicitly.
  - gdal>=3.3
  - libgdal-netcdf
  - libgdal-hdf5
  - h5py>=3.6
  - hdf5!=1.12.2
  - numba>=0.56
  - numpy>=1.23
  - pydantic>=2.1
  - pyproj>=3.3
  - rasterio>=1.3
  - ruamel.yaml>=0.15
  - scipy>=1.12
  - threadpoolctl>=3.0
  - tqdm>=4.60
  - typing_extensions>=3.10
  - tyro>=0.9.20

  # --- whirlwind --------------------------------------------------------
  # `whirlwind-insar` (scottstanie/whirlwind-insar) is the package dolphin's
  # `unwrap/_whirlwind.py` is written against: a Rust reimplementation that
  # imports as `whirlwind`.
  #
  # It is NOT `isce-framework/whirlwind`, the C++/CMake tree this env
  # previously tried to source-build. That one exposes only
  #
  #     unwrap(igram, corr, nlooks, *, mask=None) -> ndarray
  #
  # and cannot satisfy dolphin's call, which passes eleven more keyword
  # arguments and unpacks `(unw, conncomp)`. The 0.9.0 signature matches
  # dolphin kwarg for kwarg. Confirmed by the maintainer in
  # dolphin-benchmark#13; a paper explaining the split is forthcoming.
  #
  # Ships abi3 wheels (cp311+) plus a conda-forge package and depends on
  # numpy alone, so no C++ toolchain is needed here. It is also Apache-2.0 /
  # BSD dual-licensed, unlike the SNAPHU core vendored by snaphu-py, which
  # carries a Stanford non-commercial restriction.
  - whirlwind-insar>=0.9

  - pip:
    # Same moving-target pin as docker/conda-env.yml — dolphin main needs
    # `is_remote_url`, which no opera-utils release ships yet.
    - git+https://github.com/opera-adt/opera-utils.git@main
